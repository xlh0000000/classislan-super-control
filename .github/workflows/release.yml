name: 发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 发布前校验
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: C# 到 TS 协议向量
        run: dotnet run --project tools/ProtocolVectors/ProtocolVectors.csproj -c Release -- --check
      - name: JCS 规范向量
        run: dotnet run --project tools/JcsVectors/JcsVectors.csproj -c Release

  plugin:
    name: 构建插件包
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: 构建插件包
        run: dotnet build plugin/ClassIsland.Control.Plugin/ClassIsland.Control.Plugin.csproj -c Release
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-cipx
          path: |
            plugin/ClassIsland.Control.Plugin/cipx/ClassIsland.Control.Plugin.cipx
            plugin/ClassIsland.Control.Plugin/cipx/checksums.md
          if-no-files-found: error

  web:
    name: 构建服务端
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: |
          set +e
          node -v && npm -v
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/npm-ci.log" 2>&1
          code=$?
          set -e
          tail -n 30 "$RUNNER_TEMP/npm-ci.log"
          if [ "$code" -ne 0 ]; then
            summary=$(grep -i 'npm error' "$RUNNER_TEMP/npm-ci.log" | tail -n 6 | tr -d '\r' | tr '\n' '~')
            if [ -z "$summary" ]; then summary=$(tail -n 6 "$RUNNER_TEMP/npm-ci.log" | tr -d '\r' | tr '\n' '~'); fi
            printf '::error title=npm ci 失败::%s\n' "${summary//\%/%25}"
          fi
          exit "$code"
      - name: 生产构建
        run: npm run build
      - name: 打包服务端
        run: |
          tar -czf classisland-control-${{ github.ref_name }}.tar.gz -C .output .
          sha256sum classisland-control-${{ github.ref_name }}.tar.gz > classisland-control-${{ github.ref_name }}.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: server-tarball
          path: classisland-control-*
          if-no-files-found: error

  docker:
    name: 推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: 生成小写镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 建立 Release
    needs: [plugin, web, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: 校对版本一致性
        run: |
          manifest=$(sed -n 's/^version:[[:space:]]*//p' plugin/ClassIsland.Control.Plugin/manifest.yml | tr -d '\r' | head -n1)
          pkg=$(node -p "require('./package.json').version")
          # 服务端展示值构建期直接取 package.json，不再单独校对；插件上报的版本仍是手写，逐处比对。
          stale=$(grep -ohE '"[0-9]+\.[0-9]+\.[0-9]+"' plugin/ClassIsland.Control.Plugin/Services/CrashReporter.cs plugin/ClassIsland.Control.Plugin/Services/PollingHostedService.cs | sort -u | grep -v "^\"$pkg\"$" | tr '\n' ' ')
          tag="${GITHUB_REF_NAME#v}"
          norm() { local IFS=.; read -r a b c d <<< "$1"; echo "${a:-0}.${b:-0}.${c:-0}.${d:-0}"; }
          echo "插件清单版本 $manifest / 服务端版本 $pkg / 标签 $GITHUB_REF_NAME"
          if [ "$(norm "$manifest")" != "$(norm "$tag")" ]; then
            echo "::warning::标签 $GITHUB_REF_NAME 与 plugin/ClassIsland.Control.Plugin/manifest.yml 的 $manifest 不一致"
          fi
          if [ "$(norm "$pkg")" != "$(norm "$tag")" ]; then
            echo "::warning::标签 $GITHUB_REF_NAME 与 package.json 的 $pkg 不一致"
          fi
          if [ -n "$stale" ]; then
            echo "::warning::插件上报版本里有过期的字面量 $stale（应为 $pkg）：CrashReporter.cs 与 PollingHostedService.cs"
          fi
      - name: 整理产物
        run: |
          mkdir -p upload
          find artifacts -name '*.cipx' -exec cp {} upload/ \;
          find artifacts -name 'checksums.md' -exec cp {} upload/ \;
          find artifacts -name '*.tar.gz' -exec cp {} upload/ \;
          find artifacts -name '*.tar.gz.sha256' -exec cp {} upload/ \;
          ls -l upload
          test -n "$(ls -A upload)"
      - name: 建立或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" upload/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" upload/* --title "$GITHUB_REF_NAME" --generate-notes
          fi