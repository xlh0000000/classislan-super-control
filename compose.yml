services:
  control:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      CLASSISLAND_CONTROL_DATA_DIR: /data
      CLASSISLAND_CONTROL_BOOTSTRAP_TOKEN: ${CLASSISLAND_CONTROL_BOOTSTRAP_TOKEN:?必须设置为至少 16 位的随机字符串，否则拒绝启动}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - classisland-control-data:/data

volumes:
  classisland-control-data: